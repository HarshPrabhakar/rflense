[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rflens"
version = "0.1.0"
description = "Toolkit for characterizing recorded IQ signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "typer>=0.12"]

[project.optional-dependencies]
sigmf = ["sigmf>=1.2"]
test = ["pytest>=8", "pytest-cov>=5"]
ui = ["streamlit>=1.35"]
validation = ["PyYAML>=6"]
quality = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rflens = "rflens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
omit = ["src/rflens/app.py"]

[tool.coverage.report]
fail_under = 85
